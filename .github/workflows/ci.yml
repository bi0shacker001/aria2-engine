name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    # libaria2 and its dependencies for each ABI droidtop and Enginehost ship, plus the smoke test.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build libaria2
        run: build/build.sh ${{ matrix.abi }} out/${{ matrix.abi }}
      - name: Build the smoke test
        run: build/smoke.sh ${{ matrix.abi }} out/${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: aria2-${{ matrix.abi }}
          path: |
            out/${{ matrix.abi }}/prefix/include
            out/${{ matrix.abi }}/prefix/lib/*.a
            out/${{ matrix.abi }}/prefix/lib/pkgconfig
            out/${{ matrix.abi }}/prefix/bin/aria2c
            out/${{ matrix.abi }}/engine_smoke
            out/${{ matrix.abi }}/aria2-configure.log
          if-no-files-found: error

  android-emulator:
    # The smoke test on a real Android: HTTP from the runner (10.0.2.2 from the emulator) and HTTPS with the
    # platform's own certificates.
    needs: [android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aria2-x86_64
          path: artifact
      - name: Serve a test file
        run: |
          mkdir -p served
          head -c 5242880 /dev/urandom > served/blob.bin
          # Ranges, so a download that loses its connection resumes; /cut/ drops one on purpose (build/range-server.py).
          nohup python3 build/range-server.py served 8000 > range-server.log 2>&1 &
          sleep 1
          curl -sSf -o /dev/null http://127.0.0.1:8000/blob.bin
          curl -sSf -o /dev/null -H 'Range: bytes=0-0' http://127.0.0.1:8000/blob.bin
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: build/emulator-smoke.sh artifact

  library:
    # The Android library both hosts bundle: the engine service, the JNI layer and the Kotlin API, with its unit tests.
    needs: [android-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: aria2-arm64-v8a
          path: out/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: aria2-x86_64
          path: out/x86_64
      - name: Unit tests and the release AAR
        run: ./gradlew --no-daemon :engine:testDebugUnitTest :engine:assembleRelease -Paria2Prefix=out
      - uses: actions/upload-artifact@v4
        with:
          name: aria2-engine-aar
          path: engine/build/outputs/aar/engine-release.aar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-test-reports
          path: engine/build/reports/tests/
          if-no-files-found: ignore

  library-emulator:
    # The whole path on a device: isolated engine process, lockdown, the host's broker, libaria2.
    needs: [android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 28: the engine under the host's UID (EngineOpenService); 30 and 34: the isolated engine.
        api: [28, 30, 34]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: aria2-x86_64
          path: out/x86_64
      - name: Serve a test file
        run: |
          mkdir -p served
          head -c 5242880 /dev/urandom > served/blob.bin
          # Ranges, so a download that loses its connection resumes; /cut/ drops one on purpose (build/range-server.py).
          nohup python3 build/range-server.py served 8000 > range-server.log 2>&1 &
          sleep 1
          curl -sSf -o /dev/null http://127.0.0.1:8000/blob.bin
          curl -sSf -o /dev/null -H 'Range: bytes=0-0' http://127.0.0.1:8000/blob.bin
      - name: Build the test APK
        run: |
          ./gradlew --no-daemon :engine:assembleDebugAndroidTest -Paria2Prefix=out -Pandroid.injected.build.abi=x86_64
          echo "TEST_APK=$(find engine/build -name '*androidTest*.apk' | head -1)" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          # am instrument, not Gradle's connected task: no second adb client beside the runner's.
          script: build/emulator-instrument.sh ${{ env.TEST_APK }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-test-reports-${{ matrix.api }}
          path: engine/build/reports/androidTests/
          if-no-files-found: ignore

  release:
    # A tag v<version> publishes the AAR as a GitHub release, which droidtop and Enginehost pin by digest.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [library, library-emulator, android-emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aria2-engine-aar
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          mv engine-release.aar "aria2-engine-${GITHUB_REF_NAME#v}.aar"
          sha256sum *.aar > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "aria2-engine ${GITHUB_REF_NAME#v}" \
            --notes "libaria2 1.37.0 (OpenSSL 3.5.4, expat 2.7.3) as an isolated Android download engine, for arm64-v8a and x86_64. See docs/design.md." \
            *.aar SHA256SUMS
